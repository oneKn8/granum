  <circle cx="22" cy="27" r="1.6" fill="none" stroke="#b9b3a4" stroke-width="1"/>
  <circle cx="7" cy="25" r="2.4" fill="#2e7d52"/>
  <circle cx="25" cy="8" r="3.4" fill="#caa23f"/>
